<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Thank You | VibeXmith</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    background: #0b0b0b;
    color: #fff;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

/* ===== Luxury Background ===== */
.bg {
    position: absolute;
    width: 100%;
    height: 100%;
    z-index: 0;
}

.bg span {
    position: absolute;
    width: 400px;
    height: 400px;
    background: radial-gradient(circle, rgba(199,169,109,0.18), transparent 70%);
    border-radius: 50%;
    animation: float 25s infinite ease-in-out;
}

.bg span:nth-child(1) {
    top: 10%;
    left: 10%;
}

.bg span:nth-child(2) {
    top: 60%;
    left: 65%;
    animation-duration: 35s;
}

.bg span:nth-child(3) {
    top: 30%;
    left: 40%;
    width: 300px;
    height: 300px;
    animation-duration: 30s;
}

@keyframes float {
    0% { transform: translateY(0); }
    50% { transform: translateY(-50px); }
    100% { transform: translateY(0); }
}

/* ===== Card ===== */
.card {
    position: relative;
    z-index: 2;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(199,169,109,0.3);
    padding: 50px 60px;
    border-radius: 20px;
    text-align: center;
    max-width: 520px;
    backdrop-filter: blur(15px);
    box-shadow: 0 0 60px rgba(199,169,109,0.15);
}

.card h1 {
    font-size: 42px;
    color: #c7a96d;
    margin-bottom: 15px;
    letter-spacing: 2px;
}

.card p {
    font-size: 16px;
    color: #d6d6d6;
    line-height: 1.7;
    margin-bottom: 30px;
}

.brand {
    font-size: 14px;
    letter-spacing: 3px;
    color: #888;
    margin-bottom: 35px;
}

/* ===== Button ===== */
.btn {
    display: inline-block;
    padding: 14px 36px;
    border-radius: 40px;
    background: linear-gradient(135deg, #c7a96d, #9c7c3f);
    color: #000;
    text-decoration: none;
    font-weight: 600;
    transition: all 0.3s ease;
}

.btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 30px rgba(199,169,109,0.4);
}
</style>
</head>

<body>

<div class="bg">
    <span></span>
    <span></span>
    <span></span>
</div>

<div class="card">
    <div class="brand">VIBEXSMITH PRODUCTIONS</div>
    <h1>Thank You</h1>
    <p>
        Your request has been successfully submitted.<br>
        Our team will contact you shortly to craft an unforgettable experience.
    </p>
    <a href="/" class="btn">Back to Home</a>
</div>

</body>
</html>

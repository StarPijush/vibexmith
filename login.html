<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login – VibeXmith</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        body {
            background: #0b0b0b;
            color: #fff;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .login-box {
            background: #111;
            padding: 40px;
            border-radius: 16px;
            width: 320px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
        }

        h2 {
            margin-bottom: 25px;
            text-align: center;
            letter-spacing: 1px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 16px;
            background: #0b0b0b;
            border: 1px solid #333;
            border-radius: 10px;
            color: #fff;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #cfa75e;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
        }

        .error {
            color: #ff5c5c;
            font-size: 14px;
            text-align: center;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="login-box">
    <h2>Admin Login</h2>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>
</div>

</body>
</html>
